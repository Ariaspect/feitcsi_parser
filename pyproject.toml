[project]
name = "feitcsi-parser"
version = "0.1.0"
description = "FeitCSI realtime heatmap — FastAPI backend + React/uPlot frontend"
readme = "README.md"
authors = [
    { name = "Ariaspect", email = "keeminjoon@kaist.ac.kr" }
]
requires-python = ">=3.12"
dependencies = [
    "CSIKit>=2.5",
    "fastapi>=0.115",
    "numpy>=1.26",
    # backend.presence needs butter/filtfilt for the respiration bandpass.
    # It arrives with CSIKit today, but importing it directly makes it ours.
    "scipy>=1.11",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "backend"
module-root = ""

[dependency-groups]
cv = [
    "opencv-python-headless>=5.0.0.93",
    "tzdata>=2026.3",
    "ultralytics>=8.4.138",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv]
# ultralytics pulls opencv-python, whose cv2 links libGL. This host is a
# headless container and apt is sudo-gated, so libGL.so.1 is not installable.
# The headless wheel is the same cv2 minus the GUI backends -- which nothing
# here wants, since every frame is read from a tar and written to JSON. The
# never-satisfiable marker drops the GUI build; the real one is declared in
# the cv group.
override-dependencies = ["opencv-python ; python_version < '0'"]
