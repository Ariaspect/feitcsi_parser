[project]
name = "feitcsi-parser"
version = "0.1.0"
description = "FeitCSI realtime heatmap — FastAPI backend + React/uPlot frontend"
readme = "README.md"
authors = [
    { name = "Ariaspect", email = "keeminjoon@kaist.ac.kr" }
]
requires-python = ">=3.12"
dependencies = [
    "CSIKit>=2.5",
    "fastapi>=0.115",
    "numpy>=1.26",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "backend"
module-root = ""
